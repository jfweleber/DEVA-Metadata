# Static site: no build step, publish the repository root.
[build]
  publish = "."
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "same-origin"

# The app is redeployed as a unit, so modules should not be cached across deploys.
[[headers]]
  for = "/src/*"
  [headers.values]
    Cache-Control = "no-cache"
