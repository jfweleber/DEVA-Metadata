name: Deploy to weleber.net

# metadata.weleber.net is served by nginx on the Linode from
# /var/www/deva-metadata -- NOT by GitHub Pages. The Pages workflow in
# deploy.yml publishes a second copy at the Pages URL; this one updates the
# site people actually visit. Without it, pushes to main never reached
# production at all.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-deva-linode
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test

  deploy:
    needs: test          # a red test never reaches production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Preview changes (dry run)
        run: |
          rsync -rltzD --delete --no-perms --no-owner --no-group --omit-dir-times \
            --dry-run --itemize-changes \
            --exclude-from=.github/deploy-excludes.txt \
            -e "ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o StrictHostKeyChecking=yes" \
            ./ deploy@${{ secrets.DEPLOY_HOST }}:/var/www/deva-metadata/

      - name: Sync files to server
        run: |
          rsync -rltzD --delete --no-perms --no-owner --no-group --omit-dir-times \
            --exclude-from=.github/deploy-excludes.txt \
            -e "ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o StrictHostKeyChecking=yes" \
            ./ deploy@${{ secrets.DEPLOY_HOST }}:/var/www/deva-metadata/

      - name: Health check
        run: |
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 https://metadata.weleber.net/ || echo 000)
            echo "attempt $i: HTTP $code"
            if [ "$code" = "200" ]; then echo "deploy verified"; exit 0; fi
            sleep 5
          done
          echo "health check FAILED"
          exit 1
